<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Terminal/monitor shape -->
  <rect x="10" y="12" width="44" height="32" rx="3" fill="#1a1a2e" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Screen content: code lines -->
  <rect x="15" y="18" width="20" height="2" rx="1" fill="#00d26a"/>
  <rect x="15" y="23" width="14" height="2" rx="1" fill="#60a5fa"/>
  <rect x="31" y="23" width="8" height="2" rx="1" fill="#ffa502"/>
  <rect x="15" y="28" width="24" height="2" rx="1" fill="#60a5fa"/>
  <rect x="15" y="33" width="10" height="2" rx="1" fill="#00d26a"/>
  <rect x="27" y="33" width="16" height="2" rx="1" fill="rgba(255,255,255,0.3)"/>
  <!-- Cursor blink -->
  <rect x="45" y="33" width="2" height="3" fill="#00d26a" opacity="0.9"/>
  <!-- Monitor stand -->
  <rect x="28" y="44" width="8" height="3" rx="1" fill="rgba(255,255,255,0.15)"/>
  <rect x="24" y="47" width="16" height="2" rx="1" fill="rgba(255,255,255,0.15)"/>
  <!-- Shield/checkmark overlay (bottom-right) -->
  <circle cx="48" cy="46" r="9" fill="#0d0d0d" stroke="#00d26a" stroke-width="1.5"/>
  <path d="M43 46l3 3 6-7" fill="none" stroke="#00d26a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
